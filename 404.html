<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSU Command — Page Not Found</title>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #080c10;
    color: #eef2f7;
    font-family: 'JetBrains Mono', monospace, system-ui;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
  }
  .code { font-size: 64px; font-weight: 800; color: #00d4ff; letter-spacing: -2px; }
  .msg  { font-size: 13px; color: #a0b4c8; letter-spacing: 2px; text-transform: uppercase; }
  a {
    margin-top: 8px;
    display: inline-block;
    padding: 10px 24px;
    border: 1px solid rgba(0,212,255,0.35);
    border-radius: 6px;
    color: #00d4ff;
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: all .2s;
  }
  a:hover { background: rgba(0,212,255,0.08); }
</style>
</head>
<body>
  <div class="code">404</div>
  <div class="msg">Page not found — returning to command</div>
  <a href="./index.html">← Back to Dashboard</a>
  <script>
    // Auto-redirect after 3 seconds
    setTimeout(function(){ window.location.href = './index.html'; }, 3000);
  </script>
</body>
</html>
